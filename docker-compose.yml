services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: incidentzero_lite_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: incidentzero_lite
    ports:
      - "5432:5432"
    volumes:
      - pgdata_lite:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d incidentzero_lite"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_lite:
